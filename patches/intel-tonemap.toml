# Kyo's Intel Black Tonemap Fix, as bbport applies it on Intel CPUs
# (scripts/patches.py, patches/Bloodborne.xml "Intel Black Tonemap Fix"):
# Intel's approximate float instructions round differently from the PS4's AMD
# CPU, so the flag this jump tests is never set there and the tone map stays
# dark, mostly in the DLC's areas. The jump becomes six NOPs - on Intel CPUs
# only (cpu_vendor). Off with `intel-tonemap = false` under [patches].
[patch]
name = "intel-tonemap"
eboot = "941f887a562aae054fac35af8cc8f27cf075f3d4cc2e029fb5ae2a663aaa5ae7"
description = "Intel CPUs: the tone map's gate runs as on the PS4 (no black tone map in the DLC's areas)"
cpu_vendor = "GenuineIntel"

[site.gate]
address = "0x025843e5"
expect = "0f 84 3a 01 00 00"
bytes = "90 90 90 90 90 90"
